<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GPS Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    #map { height: 100vh; }
    .btn {
      position: absolute; top: 10px; left: 10px;
      background: white; padding: 10px;
    }
  </style>
</head>
<body>

<button class="btn" onclick="savePolygons()">Зберегти геозону</button>
<div id="map"></div>

<script>

let map = L.map('map').setView([48.45, 35.05], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let drawnPolygon = null;

map.on('click', function(e) {
    if (!drawnPolygon) {
        drawnPolygon = L.polygon([e.latlng]).addTo(map);
    } else {
        drawnPolygon.addLatLng(e.latlng);
    }
});

function savePolygons() {
    if (!drawnPolygon) return alert("Немає полігону");

    fetch("/api/polygons", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify([drawnPolygon.getLatLngs()[0]])
    }).then(() => alert("Збережено!"));
}

let marker = L.marker([0,0]).addTo(map);

setInterval(() => {
    fetch("/api/gps")
        .then(r => r.json())
        .then(pos => {
            marker.setLatLng([pos.lat, pos.lon]);
        });
}, 1000);

</script>

</body>
</html>
